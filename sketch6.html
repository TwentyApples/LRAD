<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sketch 6</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/addons/p5.sound.min.js"></script>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script>

// ============================================================
// EARTHWORKS — p5.js / p5.sound
// ============================================================
//
// Put this file and:
//     earthworkspercussive.mp3
//
// in the same folder.
//
// Requires p5.js + p5.sound.
//
// The visual is deliberately pixel-sharp:
// - no blur
// - integer grid coordinates
// - pixelDensity(1)
// - rectangular landscape grid
// - constantly regenerating dark-square arrangement
// - stronger but still controlled audio glitching
// ============================================================

let song;
let fft;

let playing = false;

const AUDIO_FILE = "earthworkspercussive.mp3";

// Smaller = more pixels.
// 12–16 works well for a dense landscape grid.
const CELL = 14;

let cols;
let rows;

let darkGrid = [];
let nextGrid = [];

let glitchGrid = [];
let whiteFlashGrid = [];

let lastRefresh = 0;
let refreshInterval = 650;

let beatEnergy = 0;
let bassEnergy = 0;
let midEnergy = 0;
let highEnergy = 0;

let previousBass = 0;
let hit = 0;

let seedValue = 12345;


// ============================================================
// SETUP
// ============================================================

function preload() {
  song = loadSound(AUDIO_FILE);
}

function setup() {
  createCanvas(windowWidth, windowHeight);

  // Prevent fuzzy / retina interpolation.
  pixelDensity(1);

  noSmooth();

  fft = new p5.FFT(0.75, 256);

  calculateGrid();
  generateComposition();
}


// ============================================================
// MAIN LOOP
// ============================================================

function draw() {
  background(248);

  analyzeAudio();

  // The arrangement itself changes periodically.
  // Audio energy can accelerate the refresh.
  updateComposition();

  drawGrid();
  drawArtwork();

  // Audio-triggered flashes.
  drawAudioGlitches();

  if (!playing) {
    drawStartText();
  }
}


// ============================================================
// GRID
// ============================================================

function calculateGrid() {
  cols = floor(width / CELL);
  rows = floor(height / CELL);

  darkGrid = [];
  nextGrid = [];
  glitchGrid = [];
  whiteFlashGrid = [];

  for (let y = 0; y < rows; y++) {
    darkGrid[y] = [];
    nextGrid[y] = [];
    glitchGrid[y] = [];
    whiteFlashGrid[y] = [];

    for (let x = 0; x < cols; x++) {
      darkGrid[y][x] = false;
      nextGrid[y][x] = false;
      glitchGrid[y][x] = 0;
      whiteFlashGrid[y][x] = 0;
    }
  }
}


// ============================================================
// COMPOSITION GENERATION
// ============================================================

function generateComposition() {

  randomSeed(seedValue);

  // Start empty.
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      nextGrid[y][x] = false;
    }
  }

  // ----------------------------------------------------------
  // Large diagonal "earthwork" structure.
  //
  // This creates the characteristic descending geometric form
  // from the reference, but allows it to mutate each refresh.
  // ----------------------------------------------------------

  let startX = floor(cols * random(0.26, 0.34));
  let startY = floor(rows * random(0.30, 0.38));

  let x = startX;
  let y = startY;

  let length = floor(cols * random(0.32, 0.48));

  for (let i = 0; i < length; i++) {

    // Horizontal / diagonal movement.
    let thickness = random() < 0.45 ? 2 : 1;

    for (let ty = 0; ty < thickness; ty++) {
      for (let tx = 0; tx < 2; tx++) {

        let xx = x + tx;
        let yy = y + ty;

        if (insideGrid(xx, yy)) {
          nextGrid[yy][xx] = true;
        }
      }
    }

    // Occasionally move downward.
    if (random() < 0.30) {
      y += 1;
    }

    if (random() < 0.10) {
      y += 2;
    }

    x += random() < 0.72 ? 1 : 2;
  }


  // ----------------------------------------------------------
  // Secondary descending branches.
  // ----------------------------------------------------------

  let branchCount = floor(random(4, 8));

  for (let b = 0; b < branchCount; b++) {

    let bx = floor(random(cols * 0.30, cols * 0.72));
    let by = floor(random(rows * 0.28, rows * 0.65));

    let branchLength = floor(random(7, 20));

    for (let i = 0; i < branchLength; i++) {

      if (insideGrid(bx, by)) {
        nextGrid[by][bx] = true;

        if (random() < 0.38 && insideGrid(bx + 1, by)) {
          nextGrid[by][bx + 1] = true;
        }

        if (random() < 0.18 && insideGrid(bx, by + 1)) {
          nextGrid[by + 1][bx] = true;
        }
      }

      bx += random() < 0.72 ? 1 : 2;

      if (random() < 0.62) {
        by++;
      }
    }
  }


  // ----------------------------------------------------------
  // Small horizontal islands.
  // ----------------------------------------------------------

  let islands = floor(random(7, 16));

  for (let i = 0; i < islands; i++) {

    let ix = floor(random(cols * 0.18, cols * 0.82));
    let iy = floor(random(rows * 0.20, rows * 0.82));

    let islandWidth = floor(random(2, 8));

    for (let j = 0; j < islandWidth; j++) {

      if (insideGrid(ix + j, iy)) {
        nextGrid[iy][ix + j] = true;
      }

      // Irregular second row.
      if (random() < 0.42 && insideGrid(ix + j, iy + 1)) {
        nextGrid[iy + 1][ix + j] = true;
      }
    }
  }


  // ----------------------------------------------------------
  // Cut holes back into the structure.
  // This produces the white geometric interruptions.
  // ----------------------------------------------------------

  let holes = floor(cols * rows * 0.006);

  for (let i = 0; i < holes; i++) {

    let hx = floor(random(cols));
    let hy = floor(random(rows));

    if (nextGrid[hy][hx]) {

      let holeSize = random() < 0.8 ? 1 : 2;

      for (let yy = 0; yy < holeSize; yy++) {
        for (let xx = 0; xx < holeSize; xx++) {

          if (insideGrid(hx + xx, hy + yy)) {
            nextGrid[hy + yy][hx + xx] = false;
          }
        }
      }
    }
  }


  // ----------------------------------------------------------
  // A few isolated dark pixels / squares.
  // ----------------------------------------------------------

  let isolated = floor(cols * 0.12);

  for (let i = 0; i < isolated; i++) {

    let px = floor(random(cols));
    let py = floor(random(rows));

    if (random() < 0.65) {
      nextGrid[py][px] = true;
    }
  }
}


// ============================================================
// COMPOSITION REFRESH
// ============================================================

function updateComposition() {

  let now = millis();

  // Stronger audio = slightly faster structural mutation.
  let audioSpeed = map(
    beatEnergy,
    0,
    1,
    900,
    280
  );

  refreshInterval = constrain(audioSpeed, 260, 900);

  if (now - lastRefresh > refreshInterval) {

    lastRefresh = now;

    // Change the random seed.
    seedValue += floor(random(1000, 100000));

    generateComposition();

    // Cross-fade isn't used: the visual should snap,
    // like a physical grid being rearranged.
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {

        let oldValue = darkGrid[y][x];
        let newValue = nextGrid[y][x];

        // Mark changed cells for a short glitch.
        if (oldValue !== newValue) {
          glitchGrid[y][x] = 1;
        }

        darkGrid[y][x] = newValue;
      }
    }
  }


  // Decay change indicators.
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {

      glitchGrid[y][x] *= 0.88;
      whiteFlashGrid[y][x] *= 0.82;

      // Audio causes individual dark squares to switch.
      if (
        hit > 0.35 &&
        random() < hit * 0.0035
      ) {
        glitchGrid[y][x] = 1;

        if (random() < 0.55) {
          darkGrid[y][x] = !darkGrid[y][x];
        }

        if (random() < 0.25) {
          whiteFlashGrid[y][x] = 1;
        }
      }
    }
  }
}


// ============================================================
// AUDIO ANALYSIS
// ============================================================

function analyzeAudio() {

  if (!playing) {
    beatEnergy *= 0.94;
    hit *= 0.90;
    return;
  }

  fft.analyze();

  bassEnergy = fft.getEnergy("bass") / 255;
  midEnergy = fft.getEnergy("mid") / 255;
  highEnergy = fft.getEnergy("treble") / 255;

  let overall =
    bassEnergy * 0.55 +
    midEnergy * 0.30 +
    highEnergy * 0.15;

  beatEnergy = lerp(
    beatEnergy,
    overall,
    0.12
  );

  // Detect sudden bass changes.
  let bassJump = bassEnergy - previousBass;

  if (bassJump > 0.055) {
    hit = constrain(
      hit + bassJump * 3.5,
      0,
      1
    );

    triggerAudioGlitch();
  } else {
    hit *= 0.91;
  }

  previousBass = lerp(
    previousBass,
    bassEnergy,
    0.08
  );
}


// ============================================================
// AUDIO GLITCHES
// ============================================================

function triggerAudioGlitch() {

  // Number of cells affected by a hit.
  let amount = floor(
    map(hit, 0, 1, 8, 45)
  );

  for (let i = 0; i < amount; i++) {

    let x = floor(random(cols));
    let y = floor(random(rows));

    glitchGrid[y][x] = 1;

    // More black flashing than the previous version.
    if (random() < 0.70) {
      darkGrid[y][x] = !darkGrid[y][x];
    }

    // White flash is slightly rarer.
    if (random() < 0.22) {
      whiteFlashGrid[y][x] = 1;
    }
  }
}


// ============================================================
// DRAW GRID
// ============================================================

function drawGrid() {

  // Very fine grid lines.
  stroke(25, 25, 25, 105);
  strokeWeight(1);

  // Drawing at integer coordinates keeps the grid crisp.
  for (let x = 0; x <= cols; x++) {
    let px = x * CELL;

    line(
      px,
      0,
      px,
      rows * CELL
    );
  }

  for (let y = 0; y <= rows; y++) {
    let py = y * CELL;

    line(
      0,
      py,
      cols * CELL,
      py
    );
  }
}


// ============================================================
// DRAW ARTWORK
// ============================================================

function drawArtwork() {

  noStroke();

  for (let y = 0; y < rows; y++) {

    for (let x = 0; x < cols; x++) {

      let px = x * CELL;
      let py = y * CELL;

      let dark = darkGrid[y][x];

      // ------------------------------------------------------
      // Dark squares
      // ------------------------------------------------------

      if (dark) {

        fill(8, 15, 22);

        rect(
          px,
          py,
          CELL,
          CELL
        );

        // Occasional diagonal texture.
        // Kept extremely sharp and restrained.
        if (
          (x + y) % 3 === 0 &&
          glitchGrid[y][x] < 0.25
        ) {

          stroke(235, 238, 240, 190);
          strokeWeight(1);

          line(
            px,
            py + CELL,
            px + CELL,
            py
          );

          noStroke();
        }
      }


      // ------------------------------------------------------
      // Changed cells briefly invert.
      // ------------------------------------------------------

      if (glitchGrid[y][x] > 0.42) {

        let probability =
          glitchGrid[y][x] * 0.9;

        if (random() < probability) {

          // This is the main black/white glitch mechanism.
          if (random() < 0.68) {

            fill(0);

            rect(
              px,
              py,
              CELL,
              CELL
            );

          } else {

            fill(255);

            rect(
              px,
              py,
              CELL,
              CELL
            );
          }
        }
      }


      // ------------------------------------------------------
      // White flash.
      // ------------------------------------------------------

      if (whiteFlashGrid[y][x] > 0.3) {

        fill(
          255,
          255,
          255,
          whiteFlashGrid[y][x] * 255
        );

        rect(
          px,
          py,
          CELL,
          CELL
        );
      }
    }
  }


  // ----------------------------------------------------------
  // Re-draw some grid lines over the artwork.
  //
  // This keeps the "graph paper" quality of the reference.
  // ----------------------------------------------------------

  stroke(25, 25, 25, 75);
  strokeWeight(1);

  for (let x = 0; x <= cols; x++) {

    let px = x * CELL;

    line(
      px,
      0,
      px,
      rows * CELL
    );
  }

  for (let y = 0; y <= rows; y++) {

    let py = y * CELL;

    line(
      0,
      py,
      cols * CELL,
      py
    );
  }
}


// ============================================================
// EXTRA AUDIO GLITCH LAYER
// ============================================================

function drawAudioGlitches() {

  if (hit < 0.12) {
    return;
  }

  // More frequent flashes during louder moments.
  let count = floor(
    map(
      hit,
      0,
      1,
      1,
      18
    )
  );

  for (let i = 0; i < count; i++) {

    if (random() > hit * 0.75) {
      continue;
    }

    let gx = floor(random(cols));
    let gy = floor(random(rows));

    let px = gx * CELL;
    let py = gy * CELL;

    // Mostly black.
    if (random() < 0.72) {

      fill(
        0,
        0,
        0,
        random(120, 255)
      );

    } else {

      fill(
        255,
        255,
        255,
        random(180, 255)
      );
    }

    rect(
      px,
      py,
      CELL,
      CELL
    );
  }
}


// ============================================================
// START SCREEN
// ============================================================

function drawStartText() {

  push();

  noStroke();
  fill(15, 20, 25, 180);

  textAlign(LEFT, TOP);
  textSize(11);
  textFont("monospace");

  text(
    "CLICK TO PLAY",
    CELL * 2,
    CELL * 2
  );

  pop();
}


// ============================================================
// MOUSE / AUDIO
// ============================================================

function mousePressed() {

  userStartAudio();

  if (!playing) {

    song.loop();

    playing = true;

    lastRefresh = millis();

  } else {

    if (song.isPlaying()) {
      song.pause();
    } else {
      song.loop();
    }
  }
}


// ============================================================
// RESIZE
// ============================================================

function windowResized() {

  resizeCanvas(
    windowWidth,
    windowHeight
  );

  calculateGrid();
  generateComposition();

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      darkGrid[y][x] = nextGrid[y][x];
    }
  }
}


// ============================================================
// UTILITY
// ============================================================

function insideGrid(x, y) {

  return (
    x >= 0 &&
    x < cols &&
    y >= 0 &&
    y < rows
  );
}


</script>

</body>
</html>

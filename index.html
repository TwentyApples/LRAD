<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Earworm Network</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    #sketch-container {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    #next-button {
      position: fixed;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);

      z-index: 1000;

      background: white;
      color: black;

      border: 1px solid black;

      padding: 12px 18px;

      font-family: monospace;
      font-size: 11px;

      cursor: pointer;
    }

    #next-button:hover {
      background: black;
      color: white;
    }
  </style>
</head>

<body>

  <div id="sketch-container"></div>

  <button id="next-button">NEXT</button>

  <script>

    const sketches = [
      "sketch1.html",
      "sketch2.html",
      "sketch3.html",
      "sketch4.html",
      "sketch5.html",
      "sketch6.html"
    ];

    let currentSketch = 0;

    const container =
      document.getElementById("sketch-container");

    const nextButton =
      document.getElementById("next-button");


    function loadSketch(index) {

      currentSketch = index;

      container.innerHTML = "";

      const iframe =
        document.createElement("iframe");

      iframe.src = sketches[currentSketch];

      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.border = "none";

      iframe.allow = "autoplay";

      container.appendChild(iframe);
    }


    nextButton.addEventListener("click", function () {

      currentSketch++;

      if (currentSketch >= sketches.length) {
        currentSketch = 0;
      }

      loadSketch(currentSketch);

    });


    loadSketch(0);

  </script>

</body>
</html>
